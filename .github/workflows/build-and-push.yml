name: build-and-push
on:
  push:
    branches: [main]
    paths:
      - VERSION
      - Dockerfile
      - codebase-memory-mcp
      - .github/workflows/build-and-push.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3   # required: C build compiles natively per-arch
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: CBM_VERSION=${{ steps.v.outputs.version }}
          push: true
          tags: |
            shrinedogg/codebase-memory-mcp:latest
            shrinedogg/codebase-memory-mcp:${{ steps.v.outputs.version }}

      - name: Verify manifests
        run: |
          docker buildx imagetools inspect \
            shrinedogg/codebase-memory-mcp:${{ steps.v.outputs.version }} | grep -E 'linux/(amd64|arm64)'

      - name: Smoke run (amd64)
        run: |
          out=$(docker run --rm --platform linux/amd64 \
            shrinedogg/codebase-memory-mcp:${{ steps.v.outputs.version }} --version 2>&1 || true)
          echo "$out"
          # build.sh strips the leading v: binary reports "0.10.4" for tag "v0.10.4"
          bare="${{ steps.v.outputs.version }}"
          bare="${bare#v}"
          echo "$out" | grep -q "$bare" \
            || echo "::warning::--version output did not contain $bare"

      - name: Tag repo for reproducibility
        run: |
          tag="${{ steps.v.outputs.version }}"
          if ! git ls-remote --tags origin | grep -q "refs/tags/$tag"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag"
            git push origin "$tag"
          fi
